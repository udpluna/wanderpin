# Builds the Windows app + installer and attaches them to a GitHub Release.
# To publish a new version: bump "version" in product.json and build/installer.iss, commit,
# then create and push a tag like v1.0.1 (GitHub Desktop: History > right-click commit > Create Tag, then Push).
# This workflow builds the app and creates the GitHub Release with the downloads attached.
name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt pyinstaller

      - name: Build app
        run: python -m PyInstaller build/wanderpin.spec --noconfirm --distpath dist --workpath build/work

      - name: Zip portable version
        shell: pwsh
        run: Compress-Archive -Path dist/WanderPin/* -DestinationPath dist/WanderPin-Portable-Windows.zip

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WanderPin-Windows
          path: |
            dist/WanderPin-Portable-Windows.zip
            dist/installer/*.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: WanderPin ${{ github.ref_name }}
          body: |
            ## Download
            - **WanderPin-Setup.exe**: installer (recommended)
            - **WanderPin-Portable-Windows.zip**: no install, unzip and run `WanderPin.exe`

            Windows may show "Windows protected your PC" because the app isn't code-signed yet. Click **More info → Run anyway**.

            **Before connecting:** install *Apple Devices* from the Microsoft Store, plug in your iPhone (iOS 17.4+), tap *Trust*, and turn on *Developer Mode*. The app walks you through it.
          files: |
            dist/WanderPin-Portable-Windows.zip
            dist/installer/*.exe
